services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dogparkpals-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - ./docker-secrets
    volumes:
      - ./backend/uploads:/app/uploads
      - backend-db:/app/prisma
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:3000
    container_name: dogparkpals-frontend
    ports:
      - "5173:80"
    restart: unless-stopped

  db-init:
    build:
      context: ./backend
      dockerfile: Dockerfile.db-init
    container_name: dogparkpals-db-init
    env_file:
      - ./docker-secrets
    volumes:
      - backend-db:/app/prisma
    command: sh -c "npx prisma migrate deploy && npx prisma generate"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: dogparkpals-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  backend-db:
    driver: local

networks:
  default:
    name: dogparkpals-network
