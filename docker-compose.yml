services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dogparkpals-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:./prisma/prod.db
    env_file:
      - ./docker-secrets
    volumes:
      - ./backend/uploads:/app/uploads
      - backend-db:/app/data
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:3000
    container_name: dogparkpals-frontend
    ports:
      - "5173:80"
    restart: unless-stopped

  db-init:
    build:
      context: ./backend
      dockerfile: Dockerfile.db-init
    container_name: dogparkpals-db-init
    environment:
      - DATABASE_URL=file:./data/prod.db
    env_file:
      - ./docker-secrets
    volumes:
      - backend-db:/app/data
    command: sh -c "npx prisma migrate deploy && npx prisma generate"

  backup-events:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dogparkpals-backup-events
    environment:
      - DATABASE_URL=file:./data/prod.db
    env_file:
      - ./docker-secrets
    volumes:
      - backend-db:/app/data
    entrypoint: ["npx", "tsx", "src/jobs/backupEventCli.ts"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: dogparkpals-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: dogparkpals-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: dogparkpals-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  backend-db:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  default:
    name: dogparkpals-network
