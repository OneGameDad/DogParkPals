services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dogparkpals-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/prod.db
    env_file:
      - ./docker-secrets
    volumes:
      - ./backend/uploads:/app/uploads
      - backend-db:/app/data
      - ./certs:/app/certs:ro
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=https://localhost:3000
    container_name: dogparkpals-frontend
    ports:
      - "5173:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped

  db-init:
    build:
      context: ./backend
      dockerfile: Dockerfile.db-init
    container_name: dogparkpals-db-init
    environment:
      - DATABASE_URL=file:/app/data/prod.db
    env_file:
      - ./docker-secrets
    volumes:
      - backend-db:/app/data
    command: sh -c "npx prisma migrate deploy && npx prisma generate"

  backup-events:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dogparkpals-backup-events
    environment:
      - DATABASE_URL=file:/app/data/prod.db
    env_file:
      - ./docker-secrets
    volumes:
      - backend-db:/app/data
    entrypoint: ["npx", "tsx", "src/jobs/backupEventCli.ts"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: dogparkpals-rabbitmq
    user: "999:999"
    ports:
      - "5671:5671"
      - "15671:15671"
    volumes:
      - ./certs:/etc/rabbitmq/certs:ro
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    environment:
      - RABBITMQ_NODENAME=rabbit@localhost
    command:
      - sh
      - -ec
      - 'for f in /etc/rabbitmq/certs/rabbitmq.crt /etc/rabbitmq/certs/rabbitmq.key; do if [ ! -f "$$f" ]; then echo "Missing RabbitMQ TLS file: $$f" >&2; exit 1; fi; if [ ! -r "$$f" ]; then echo "RabbitMQ TLS file is not readable: $$f" >&2; exit 1; fi; done; exec rabbitmq-server'
    tmpfs:
      - /var/lib/rabbitmq
      - /tmp
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq-exporter:
    image: kbudde/rabbitmq-exporter:latest
    container_name: dogparkpals-rabbitmq-exporter
    volumes:
      - ./certs/rabbitmq.crt:/etc/rabbitmq-exporter/ca.pem:ro
    env_file:
      - ./docker-secrets
    environment:
      - RABBIT_URL=https://rabbitmq:15671
      - CAFILE=/etc/rabbitmq-exporter/ca.pem
      - SKIPVERIFY=false
    depends_on:
      - rabbitmq
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: dogparkpals-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-web-config.yml:/etc/prometheus/web-config.yml:ro
      - ./certs/prometheus.crt:/etc/prometheus/certs/prometheus.crt:ro
      - ./certs/prometheus.key:/etc/prometheus/certs/prometheus.key:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.config.file=/etc/prometheus/web-config.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: dogparkpals-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./certs/grafana.crt:/etc/grafana/grafana.crt:ro
      - ./certs/grafana.key:/etc/grafana/grafana.key:ro
    env_file:
      - ./docker-secrets
    environment:
      - GF_SERVER_PROTOCOL=https
      - GF_SERVER_CERT_FILE=/etc/grafana/grafana.crt
      - GF_SERVER_CERT_KEY=/etc/grafana/grafana.key
    depends_on:
      - prometheus
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: dogparkpals-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    env_file:
      - ./docker-secrets
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.certificate=/usr/share/elasticsearch/config/certs/elasticsearch.crt
      - xpack.security.http.ssl.key=/usr/share/elasticsearch/config/certs/elasticsearch.key
      - xpack.security.http.ssl.verification_mode=none
      - bootstrap.memory_lock=false
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - ./certs:/usr/share/elasticsearch/config/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f -k -u elastic:$$ELASTIC_PASSWORD https://localhost:9200 >/dev/null || exit 1"]
      start_period: 120s
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: dogparkpals-logstash
    ports:
      - "5000:5000/tcp"
      - "5000:5000/udp"
      - "9600:9600"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    env_file:
      - ./docker-secrets
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: dogparkpals-kibana
    ports:
      - "5601:5601"
    env_file:
      - ./docker-secrets
    environment:
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - ELASTICSEARCH_SERVICEACCOUNT_TOKEN=${KIBANA_SERVICE_ACCOUNT_TOKEN:-}
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f -k https://localhost:5601/api/status >/dev/null || exit 1"]
      start_period: 180s
      interval: 15s
      timeout: 10s
      retries: 15
    restart: unless-stopped

volumes:
  backend-db:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  elasticsearch-data:
    driver: local

networks:
  default:
    name: dogparkpals-network
