input {
  # TCP input for application logs
  tcp {
    port => 5000
    codec => json
    type => "backend_log"
  }

  # UDP input for lightweight logging
  udp {
    port => 5000
    codec => json
    type => "backend_log"
  }
}

filter {
  # Parse incoming JSON and extract fields
  if [type] == "backend_log" {
    # Ensure we have a timestamp
    if ![timestamp] {
      date {
        match => [ "[@timestamp]", "ISO8601" ]
        target => "timestamp"
      }
    } else {
      date {
        match => [ "timestamp", "ISO8601" ]
        target => "@timestamp"
      }
    }

    # Add environment metadata
    mutate {
      add_field => {
        "environment" => "docker"
        "application" => "dogparkpals-backend"
        "service" => "backend"
      }
      
      # Rename common fields for consistency
      rename => {
        "message" => "log_message"
        "level" => "severity"
        "eventType" => "event_type"
        "eventId" => "event_id"
        "traceId" => "trace_id"
        "userId" => "user_id"
        "dogId" => "dog_id"
      }
    }

    # Parse log severity level
    if [severity] {
      translate {
        field => "severity"
        destination => "severity_number"
        dictionary => {
          "debug" => 0
          "info" => 1
          "warn" => 2
          "warning" => 2
          "error" => 3
          "fatal" => 4
        }
        fallback => 1
      }
    }

    # Tag events for easy filtering
    if [event_type] {
      mutate {
        add_tag => [ "event_driven", "event_%{event_type}" ]
      }
    }

    if [severity] == "error" or [severity] == "fatal" {
      mutate {
        add_tag => [ "error" ]
      }
    }
  }
}

output {
  # Index to Elasticsearch with time-based indices
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "dogparkpals-logs-%{+YYYY.MM.dd}"
    codec => json
  }

  # Debug output (only in development)
  # Uncomment for troubleshooting
  # stdout {
  #   codec => json
  # }
}
