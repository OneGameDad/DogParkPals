global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'dogparkpals'

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['localhost:9090']

  # Scrape the DogParkPals backend API
  - job_name: 'backend'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['backend:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Scrape RabbitMQ metrics
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq-exporter:9419']
    scrape_interval: 15s
